[project]
name = "redline"
version = "0.1.0"
description = "Lightweight document redlining for large, heavily-revised documents"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
docx = ["python-docx>=1.0"]
odt = ["odfpy>=1.4"]

[project.scripts]
redline = "redline.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
